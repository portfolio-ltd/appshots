name: Bug report
description: Something renders wrong, crashes, or exports incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include a screenshot of the editor or the exported image if you can.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Select iPhone 6.9\"\n2. Upload a landscape screenshot\n3. …"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 141 on macOS 26
    validations:
      required: true
